---
defaults:
  - data: params_acquisition
  - override hydra/sweeper: optuna
  - override hydra/sweeper/sampler: tpe
num_epochs: 50

hydra:
  sweeper:
    sampler:
      seed: 42
    direction: maximize
    study_name: sphere
    storage: null
    n_trials: 2
    n_jobs: 1
    params:
      sigma: tag(log, interval(1e-8,1))
        
MODEL_NAME: FISTA
SAVE_PATH: /home/bl279243/code/fMRI/results/FISTA 
sigma: 0.005
a: 3
wavelet_parameters:
  non_linearity: soft
  level: 6
  list_wv: 
    - db4
    - db8
  max_iter: 15

# if true, simulate a failure by raising an exception
error: false
